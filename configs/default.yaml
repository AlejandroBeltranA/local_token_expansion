run_name: "unified_default"
backend: "mlx"

models:
  - name: "Mistral-7B-Instruct-v0.3"
    path: "mlx_models/Mistral-7B-Instruct-v0.3"
    revision: null

suites:
  - "suites/core_conciseness.yaml"
  - "suites/structured_extraction.yaml"
  - "suites/long_context_stability.yaml"
  - "suites/persistent_failure_probe.yaml"

generation:
  temperature: 0.2
  top_p: 0.95
  seed: 0
  max_tokens: 192

output:
  results_dir: "results"
  reports_dir: "reports"

stress:
  enabled: true
  max_steps: 24
  max_runtime_sec: 150
  context_growth: "append"
  system: |
    You are being tested for reliability under a growing context window.
    Follow the output contract exactly.
    Never quote, continue, or paraphrase the reference block.
  prompt: |
    Produce exactly 5 bullet points for the current incident state.
    Each bullet must start with a verb and contain 4 to 8 words.
    Use this exact order:
    - report the latest status
    - preserve the current owner
    - name the next action
    - name one risk caused by prior failures
    - state one escalation condition
    Keep the owner as `Iris` unless the TASK changes it.
    No intro. No closing sentence.
  history_max_chars_per_step: 1200
  history_max_chars_total: 9600
  failure:
    consecutive: 3
    max_latency_ms: 2500
    latency_only_after_input_tokens: 1500
    fail_on_lorr: true
    max_rcs: 0.30
    # Trigger-firing thresholds inside summarize_unified_run. Declared
    # explicitly so the threshold-sensitivity sweep scales them. Until the
    # 2026-06-08 fix these lived as hardcoded constants in lte/unified.py
    # and ignored cfg, which made the sensitivity sweep partially broken.
    max_rcs_window_mean: 0.22         # last-5 stress steps mean RCS firing repetition_loop
    max_lorr_mean: 0.20               # benchmark LORR mean firing near_cap_pressure
    near_cap_window_required: 2       # stress LORR=1 hits required in window
    near_cap_window_size: 5           # window length for stress near_cap check
